<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainy Words · Server console</title>
  <style>
    :root {
      --bg: #0a0f1f; --panel: #121a33; --line: #25304f; --ink: #e9effc; --muted: #8e9cc0;
      --me: #5bd6ff; --ok: #5ef2a6; --bad: #ff6b6b; --gold: #ffd166; --foe: #ff7fa3;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    h1, h2, p { margin: 0; }
    .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { font-size: 22px; letter-spacing: -0.01em; }
    header h1 span { color: var(--me); }
    header p { color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }
    .link { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
    .link i { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
    .link[data-up="true"] i { background: var(--ok); }

    #reset { font: 700 14px/1 inherit; color: #fff; background: #d8344f; border: none; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
    #reset:hover { background: #ef4b66; }
    #reset[data-armed="true"] { background: #ffc23d; color: #1a1200; }
    #reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
    .panel h2 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .tile b { display: block; font: 800 34px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
    .tile small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }

    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 8px 6px 0; white-space: nowrap; }
    td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
    td.name { font-weight: 600; }
    .empty { color: var(--muted); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #1d2745; color: var(--muted); }
    .pill[data-kind="ready"] { color: var(--ok); }
    .pill[data-kind="playing"] { color: var(--gold); }

    .tier { margin-top: 12px; }
    .tier h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .words { display: flex; flex-wrap: wrap; gap: 5px; }
    .words span { font: 12px/1 var(--mono); padding: 5px 8px; border-radius: 6px; background: #1a2342; color: #b9c5e6; }
    .words span[data-state="falling"] { background: var(--me); color: #04121f; font-weight: 700; }
    .words span[data-state="claimed"] { background: #153b33; color: var(--ok); text-decoration: line-through; }
    .words span[data-state="missed"] { background: #3d1c28; color: #ff9db0; text-decoration: line-through; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid #4a587f; }

    pre { margin: 0; max-height: 240px; overflow: auto; font: 12px/1.6 var(--mono); color: #b9c5e6; white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Rainy <span>Words</span> · server console</h1>
        <p id="address">…</p>
      </div>
      <div class="spacer"></div>
      <span class="link" id="link" data-up="false"><i></i><span id="link-text">connecting…</span></span>
      <button id="reset" type="button" title="Stop the current game and zero every score">Reset game and scores</button>
    </header>

    <div class="tiles">
      <div class="panel tile"><h2>Clients connected</h2><b id="t-online">0</b><small id="t-online-sub">&nbsp;</small></div>
      <div class="panel tile"><h2>Match</h2><b id="t-phase">idle</b><small id="t-phase-sub">&nbsp;</small></div>
      <div class="panel tile"><h2>Time left</h2><b id="t-time">–</b><small id="t-time-sub">&nbsp;</small></div>
      <div class="panel tile"><h2>AI requests</h2><b id="t-ai">0</b><small id="t-ai-sub">&nbsp;</small><small id="t-theme-sub">&nbsp;</small><small id="t-voice-sub">&nbsp;</small></div>
    </div>

    <div class="cols">
      <div class="panel">
        <h2>Connected clients</h2>
        <div class="scroll">
          <table>
            <thead><tr><th>Nickname</th><th>Status</th><th>Score</th><th>Wins</th><th>Address</th></tr></thead>
            <tbody id="clients"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2 id="words-title">Word set of the current match</h2>
        <div id="words"><p class="empty">No match yet. The set appears here as soon as two players are ready.</p></div>
      </div>
    </div>

    <div class="panel">
      <h2>Server log</h2>
      <pre id="log"></pre>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const el = (tag, text, attrs = {}) => {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        return node;
      };
      const socket = io('/admin');
      const STATUS = { joining: 'choosing a nickname', lobby: 'in lobby', playing: 'playing', results: 'results screen' };
      const TIER_LABEL = { easy: 'Short (3–4 letters)', medium: 'Medium (5–6 letters)', hard: 'Long (7–10 letters)' };

      socket.on('connect', () => { $('link').dataset.up = 'true'; $('link-text').textContent = 'live'; });
      socket.on('disconnect', () => { $('link').dataset.up = 'false'; $('link-text').textContent = 'server stopped'; });
      socket.on('connect_error', (err) => { $('link').dataset.up = 'false'; $('link-text').textContent = err.message; });
      socket.on('state', render);

      // Two clicks instead of confirm(): some embedded browsers suppress confirm() and it silently answers "Cancel".
      const RESET_LABEL = 'Reset game and scores';
      let armedUntil = 0;
      let labelTimer = null;
      function showReset(text, armed = false, ms = 0) {
        $('reset').textContent = text;
        $('reset').dataset.armed = String(armed);
        clearTimeout(labelTimer);
        if (ms) labelTimer = setTimeout(() => showReset(RESET_LABEL), ms);
      }
      $('reset').addEventListener('click', () => {
        if (Date.now() > armedUntil) {
          armedUntil = Date.now() + 4000;
          showReset('Click again to reset', true, 4000);
          return;
        }
        armedUntil = 0;
        showReset('Resetting…');
        socket.timeout(5000).emit('reset', (err, res) => showReset(!err && res && res.ok ? 'Game and scores reset ✓' : 'Reset failed: server not answering', false, 2500));
      });

      function render(s) {
        const lan = s.server.lan.length ? s.server.lan.join(', ') : 'none found';
        $('address').textContent = `Clients connect to ${s.server.host}:${s.server.port} · this computer's LAN address: ${lan}`;

        $('t-online').textContent = s.online;
        const names = s.clients.map((c) => c.name || '(choosing)');
        $('t-online-sub').textContent = names.length ? names.join(', ') : 'nobody yet';

        const m = s.match;
        $('t-phase').textContent = m ? m.phase : 'idle';
        $('t-phase-sub').textContent = m
          ? `#${m.id} · ${m.mode} · ${m.players.map((p) => `${p.name} ${p.score}`).join(' : ')}`
          : `next match: ${s.mode} mode, ${s.theme ? `theme "${s.theme}"` : 'random theme'}`;
        $('t-time').textContent = m ? `${Math.ceil(m.timeLeftMs / 1000)}s` : '–';
        $('t-time-sub').textContent = m ? `speed ${m.level}/5 · ${m.weather}` : ' ';

        $('t-ai').textContent = s.ai.calls;
        $('t-ai-sub').textContent = s.ai.enabled
          ? `${s.ai.model} · ${s.ai.words} word sets, ${s.ai.commentary} comments · ${s.ai.inputTokens} in / ${s.ai.outputTokens} out tokens${s.ai.failures ? ` · ${s.ai.failures} failed (${s.ai.lastError})` : ''}`
          : `offline: ${s.ai.reason}`;

        const t = s.themeAi;
        $('t-theme-sub').textContent = {
          off: 'theme words: off',
          failed: `theme words: unavailable (${t.reason})`,
          ready: `theme words: local model · ${t.words} words · ${t.themes} ${t.themes === 1 ? 'theme' : 'themes'} picked`,
        }[t.state] || 'theme words: model loading…';

        const v = s.voice;
        $('t-voice-sub').textContent = {
          off: 'voice: off',
          failed: `voice: unavailable (${v.reason})`,
          ready: `voice: Kokoro ${v.voice} · ${v.lines} lines spoken${v.failures ? ` · ${v.failures} failed` : ''}`,
        }[v.state] || 'voice: Kokoro loading…';

        const rows = s.clients.map((c) => {
          const row = el('tr');
          const kind = c.status === 'lobby' && c.ready ? 'ready' : c.status;
          const status = el('td');
          status.append(el('span', kind === 'ready' ? 'ready' : STATUS[c.status] || c.status, { class: 'pill', 'data-kind': kind }));
          row.append(el('td', c.name || '—', { class: 'name' }), status, el('td', c.score === null ? '–' : String(c.score)), el('td', String(c.wins)), el('td', c.ip));
          return row;
        });
        if (!rows.length) {
          const row = el('tr');
          row.append(el('td', 'No clients connected.', { colspan: '5', class: 'empty' }));
          rows.push(row);
        }
        $('clients').replaceChildren(...rows);

        const box = $('words');
        if (!m) {
          $('words-title').textContent = 'Word set of the current match';
          box.replaceChildren(el('p', 'No match right now. The set appears here as soon as two players are ready.', { class: 'empty' }));
        } else if (!m.words.length) {
          $('words-title').textContent = `Word set of match #${m.id}`;
          box.replaceChildren(el('p', 'Generating the word set…', { class: 'empty' }));
        } else {
          const source = {
            ai: 'written by the LLM',
            'ai+bank': 'LLM, topped up from the local bank',
            'local-ai': 'picked by the local AI model',
            'local-ai+bank': 'local AI model, topped up from the local bank',
            bank: 'local word bank',
          }[m.source];
          $('words-title').textContent = `Word set of match #${m.id} · ${m.words.length} unique words · theme: ${m.theme} · ${source}`;
          const groups = ['easy', 'medium', 'hard'].map((tier) => {
            const group = el('div', undefined, { class: 'tier' });
            const list = el('div', undefined, { class: 'words' });
            for (const w of m.words.filter((word) => word.tier === tier)) {
              list.append(el('span', w.text, { 'data-state': w.state, title: w.state === 'claimed' ? `typed by ${w.by}` : w.state }));
            }
            group.append(el('h3', TIER_LABEL[tier]), list);
            return group;
          });
          const legend = el('div', undefined, { class: 'legend' });
          for (const [color, label] of [['#1a2342', 'not used yet'], ['#5bd6ff', 'falling now'], ['#153b33', 'typed by a player'], ['#3d1c28', 'reached the ground']]) {
            const item = el('span');
            const swatch = el('i');
            swatch.style.background = color;
            item.append(swatch, label);
            legend.append(item);
          }
          box.replaceChildren(...groups, legend);
        }

        const log = $('log');
        const pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
        log.textContent = s.log.join('\n');
        if (pinned) log.scrollTop = log.scrollHeight;
      }
    })();
  </script>
</body>
</html>
